<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>تمرین حکم</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>تمرین حکم 🃏</h1>
        <p>تمرکز: شمردن حکم، تشخیص خال تمام‌شده، حفظ آس‌ها</p>
      </div>
      <button id="newGameBtn">دست جدید</button>
    </header>

    <section class="status">
      <div><span>حکم:</span><b id="trumpText"></b></div>
      <div><span>دور:</span><b id="roundText">۱ از ۵</b></div>
      <div><span>امتیاز:</span><b id="scoreText">۰</b></div>
    </section>

    <section class="table">
      <div class="seat partner">
        <div class="seat-title">یار من</div>
        <div class="seat-sub">روبه‌رو</div>
      </div>

      <div class="seat left">
        <div class="seat-title">حریف چپ</div>
      </div>

      <div class="center">
        <div id="cards" class="played-cards"></div>
      </div>

      <div class="seat right">
        <div class="seat-title">حریف راست</div>
      </div>

      <div class="seat me">
        <div class="seat-title">من</div>
        <div class="seat-sub">پایین</div>
      </div>
    </section>

    <section class="panel">
      <h2>سؤال تمرینی</h2>
      <div id="questionBox"></div>
      <div class="actions">
        <button id="checkBtn">بررسی پاسخ</button>
        <button id="nextBtn" class="ghost" disabled>دور بعد</button>
      </div>
      <div id="feedback"></div>
    </section>

    <section class="panel">
      <h2>دفتر ذهنی</h2>
      <div class="memory-grid">
        <div><b>حکم‌های خارج‌شده</b><p id="playedTrumpMemo">؟</p></div>
        <div><b>آس‌های بازی‌شده</b><p id="acesMemo">؟</p></div>
        <div><b>خال‌های تمام‌شده</b><p id="voidMemo">؟</p></div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
