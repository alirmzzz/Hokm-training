<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>تمرین حکم</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>تمرین حکم 🃏</h1>
        <p>تمرکز: شمردن حکم، تشخیص خال تمام‌شده، حفظ آس‌ها</p>
      </div>
      <button id="newGameBtn">دست جدید</button>
    </header>

    <section class="panel">
      <div class="row">
        <div><span class="label">حکم:</span> <b id="trumpText"></b></div>
        <div><span class="label">دور:</span> <b id="roundText">۱ از ۵</b></div>
        <div><span class="label">امتیاز:</span> <b id="scoreText">۰</b></div>
      </div>
    </section>

    <section class="table">
      <div class="player top">حریف روبه‌رو</div>
      <div class="middle">
        <div class="player side">حریف راست</div>
        <div class="cards" id="cards"></div>
        <div class="player side">یار / چپ</div>
      </div>
      <div class="player bottom">تو</div>
    </section>

    <section class="panel">
      <h2>سؤال تمرینی</h2>
      <div id="questionBox"></div>
      <div class="actions">
        <button id="checkBtn">بررسی پاسخ</button>
        <button id="nextBtn" class="ghost" disabled>دور بعد</button>
      </div>
      <div id="feedback"></div>
    </section>

    <section class="panel compact">
      <h2>دفتر ذهنی تو</h2>
      <div class="memory-grid">
        <div>
          <b>حکم‌های خارج‌شده</b>
          <p id="playedTrumpMemo">۰</p>
        </div>
        <div>
          <b>آس‌های بازی‌شده</b>
          <p id="acesMemo">—</p>
        </div>
        <div>
          <b>خال‌های تمام‌شده</b>
          <p id="voidMemo">—</p>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
